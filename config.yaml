epochs: 500
test_size: 0.2
seed: 42
n_testseeds: 3
kfold_k: 3
lr: 0.005
batch_size: -1
max_recorded_samples: 56
n_alphas: 5
network_type: diamond

features: 
  - sepal_length_cm
  - sepal_width_cm
  - petal_length_cm
  - petal_width_cm
  - stem_thickness_mm
  - petal_density_pct
  - chlorophyll_index
  - native_altitude_m

labels: 
  - species

activations: 
  - Tanh
  - IPLo
  - ReLU

eval_metrics: 
  - accuracy
  - balanced_accuracy
  - mcc
  - r2

reducers: 
  - log_average
  - mean
  - stdeviation
  - norm

kf_reducers:
  - mean
  - stdeviation

categories:
  - grad
  - testloss
  - testpreds
  - metrics
  - agrad
  - aouts
  - ls

activation_mods:
  Tanh:
     LS:
      alpha: 0.25
      learnable: true
  IPLo:
    LS:
      alpha: 0.20
      learnable: false

network_mods:
  diamond:
    batchnorm: true
    dropout:
      p: 0.20
    residual:
      block_size: 3
  
  short:
    layernorm: true